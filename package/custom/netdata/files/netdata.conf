[global]
	run as user = root

[db]
	db = ram
	update every = 2
	retention = 1h
	memory deduplication (ksm) = no

[logs]
	daemon = syslog
	debug = none
	access = none

[web]
	default port = 19999
	allow connections from = localhost 127.* ::1 10.* 192.168.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.* fc* fd*
	allow dashboard from = localhost 127.* ::1 10.* 192.168.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.* fc* fd*

[plugins]
	apps = no
	cgroups = no
	charts.d = no
	python.d = no

[plugin:proc:ipc]
	shared memory totals = no
